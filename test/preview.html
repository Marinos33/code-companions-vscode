<!doctype html>
<!-- The pet page outside VS Code, for checking a character and its reactions in a browser:
     serve vscode-extension/ (node test/serve.js) and open /test/preview.html -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Code Companions preview</title>
  <link rel="stylesheet" href="../media/pet.css">
  <style>
    body { background: #1e1e1e; font: 13px system-ui, sans-serif; color: #ccc; }
    .panel { width: 320px; height: 180px; border: 1px solid #333; margin: 12px; resize: both; overflow: hidden; }
    .buttons { margin: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; }
    button, select { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="panel"><div id="stage"><canvas id="bg" hidden></canvas><div id="bubble" hidden></div><canvas id="pet"></canvas></div></div>
  <div class="buttons"><select id="scene" aria-label="Background"></select></div>
  <div class="buttons" id="buttons"></div>
  <script src="../media/backgrounds.js"></script>
  <script src="../media/pet.js"></script>
  <script>
    // The reactions src/behaviors.js gives for these events (copied: this page has no require).
    const reactions = {
      thinking: { behavior: 'thinking', anim: 'failed', line: 'Pondering very hard…', sticky: true },
      editing: { behavior: 'editing', anim: 'review', line: 'Scribbling furiously…', sticky: true },
      reading: { behavior: 'reading', anim: 'waiting', line: 'Peeking at the file…', sticky: true },
      searching: { behavior: 'searching', anim: 'runLeft', line: 'Hunting for clues…', sticky: true },
      shell: { behavior: 'shell', anim: 'running', line: 'Vibing with the terminal…', sticky: true },
      delegating: { behavior: 'delegating', anim: 'jumping', line: 'Sending little helpers…', sticky: true },
      asking: { behavior: 'asking', anim: 'waiting', line: 'Waiting for you…', sticky: true },
      oops: { behavior: 'oops', anim: 'failed', line: 'Oops, that stumbled…', sticky: true },
      done: { behavior: 'done', anim: 'jumping', line: 'All done!', sticky: false, ms: 2500 },
      idle: { behavior: 'idle', anim: 'idle', line: '', sticky: false },
    }
    const box = document.getElementById('buttons')
    for (const [name, reaction] of Object.entries(reactions)) {
      const b = document.createElement('button')
      b.textContent = name
      b.onclick = () => petTest.receive({ type: 'react', reaction })
      box.append(b)
    }
    // ?bg=night (or desk, sakura, city, reactive) picks the scene, ?w= and ?h= the view's size,
    // ?react=thinking (or another button's name) a reaction to start with, ?pet= another
    // character's pet.json (a path the server serves).
    const params = new URLSearchParams(location.search)
    let background = params.get('bg') || 'none'
    const panel = document.querySelector('.panel')
    if (params.get('w')) panel.style.width = `${params.get('w')}px`
    if (params.get('h')) panel.style.height = `${params.get('h')}px`
    let character = { id: 'aemeath-mini', name: 'Aemeath Mini', sheet: '../characters/aemeath-mini/spritesheet.webp' }
    const setup = () => petTest.receive({ type: 'setup', size: 120, speechBubble: true, wander: true, background, character })
    const scene = document.getElementById('scene')
    for (const name of ['none', ...Object.keys(petBackgrounds)]) scene.append(new Option(name, name, false, name === background))
    scene.onchange = () => {
      background = scene.value
      setup()
    }
    const start = () => {
      setup()
      if (reactions[params.get('react')]) petTest.receive({ type: 'react', reaction: reactions[params.get('react')] })
    }
    const petFile = params.get('pet')
    if (petFile) {
      fetch(petFile).then(r => r.json()).then(pet => {
        const sheet = new URL(pet.spritesheetPath || 'spritesheet.webp', new URL(petFile, location.href)).href
        character = { id: pet.id, name: pet.displayName || pet.id, sheet, extraRows: pet.extraRows || {}, loopFrom: pet.loopFrom || {}, frameMs: pet.frameMs || {}, lines: pet.lines || {} }
        start()
      })
    } else start()
  </script>
</body>
</html>
